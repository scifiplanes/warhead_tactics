<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Contact sheet — gear / units / vehicles</title>
    <style>
      @font-face {
        font-family: "VGA";
        src: url("/fonts/PerfectDOS.ttf") format("truetype");
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        background: #0a0a0a;
        color: #c0c0c0;
        font-family: "VGA", ui-monospace, monospace;
        padding: 16px 18px 48px;
      }
      h1 { color: #e1c15a; font-weight: normal; font-size: 28px; margin: 0 0 6px; }
      h2 { font-weight: normal; font-size: 16px; margin: 22px 0 10px; color: #8a8a8a; letter-spacing: 1px; }
      .lede { color: #8a8a8a; margin: 0 0 18px; max-width: 70ch; line-height: 1.4; }
      .grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(96px, 1fr));
        gap: 8px;
      }
      .cell {
        background: #141414;
        border: 1px solid #3a3a3a;
        padding: 8px 6px 6px;
        text-align: center;
      }
      .cell.hot { border-color: #e1c15a; }
      .cell canvas {
        display: block;
        width: 64px;
        height: 64px;
        margin: 0 auto 6px;
        image-rendering: pixelated;
        background: #1c1c1c;
      }
      .cell .name { font-size: 11px; line-height: 1.2; }
      .cell .id { font-size: 10px; color: #6a6a6a; margin-top: 2px; }
    </style>
  </head>
  <body>
    <h1>CONTACT SHEET</h1>
    <p class="lede">Live sprites from <code>preview()</code>. RECONDOG is <code>k9</code> — same DOG silhouette as doghead, gray coat.</p>
    <div id="root"></div>
    <script type="module" src="/src/contact-sheet.ts"></script>
  </body>
</html>
